# mcp suite — the local MCP (stdio) server over the running DevDigest API
# (@devdigest/mcp). A thin HTTP client + protocol adapter; five tools that
# forward to @devdigest/api. Tests are hermetic units (fetch is injected).
# Uses pnpm (pnpm-lock.yaml).
#
# No `server/src/vendor/shared/**` in the path filter: unlike reviewer-core,
# this package does NOT alias @devdigest/shared — it declares its own zod-4
# schemas. Adding it would misrepresent the dependency graph.
name: mcp

on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp.yml'
  pull_request:
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp.yml'

permissions:
  contents: read

concurrency:
  group: mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mcp/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test
